<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Budget Buddy</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><div><p class="eyebrow">YOUR MONEY, MADE CLEAR</p><h1>Budget Buddy</h1></div><span class="coin">$</span></header><section class="summary"><div><p>Balance</p><strong id="balance">$0</strong></div><div><p>Income</p><strong id="income" class="green">$0</strong></div><div><p>Expenses</p><strong id="expenses" class="red">$0</strong></div></section><section class="panel"><h2>Add a transaction</h2><form id="form"><label>Description<input id="description" maxlength="40" placeholder="e.g. Books" required></label><div class="row"><label>Amount<input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></label><label>Type<select id="type"><option value="expense">Expense</option><option value="income">Income</option></select></label></div><button>Add transaction</button></form></section><section class="panel"><h2>Recent transactions</h2><ul id="list"></ul><p id="empty">No transactions yet. Add your first one above.</p></section><p class="foot">Your transactions are saved in this browser.</p></main><script src="script.js"></script></body></html>
